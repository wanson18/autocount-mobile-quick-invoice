<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f7f8fa" />
<title>Quick Invoice — Wanson</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #f1f3f6;
    --border: #e6e8ec;
    --text: #14181f;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #eff4ff;
    --danger: #d92d20;
    --warn: #b54708;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(247, 248, 250, .92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    padding: calc(env(safe-area-inset-top) + 14px) 20px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header.topbar h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .step-pill {
    font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    padding: 5px 11px; border-radius: 999px;
  }

  main { flex: 1; padding: 8px 20px 120px; }
  .screen { display: none; animation: fade .15s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  .field-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 24px 0 8px; }
  .field-label:first-child { margin-top: 0; }

  input[type="text"], input[type="search"], input[type="number"], input[type="date"], select {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    outline: none;
    box-shadow: var(--shadow);
  }
  input::placeholder { color: #9aa1ad; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }

  .company-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 14px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .choice-card:active { background: var(--panel-2); }
  .choice-card.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }

  .list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .list-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .list-item:active { background: var(--panel-2); }
  .list-item .primary { font-weight: 600; font-size: 15px; }
  .list-item .secondary { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .list-item.selected { border-color: var(--accent); background: var(--accent-soft); }
  .empty-hint { color: var(--muted); font-size: 14px; padding: 24px 4px; text-align: center; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 8px; border-radius: 999px; vertical-align: middle; margin-left: 6px;
    background: #fef3f2; color: #b42318;
  }
  .readonly-note { color: var(--muted); font-size: 14px; padding: 14px 4px; }

  .diff-row {
    font-size: 14px; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border);
  }
  .diff-row.added { border-left-color: #12b76a; }
  .diff-row.changed { border-left-color: #f79009; }
  .diff-row.removed { border-left-color: #f04438; }

  .selected-customer-card {
    margin-top: 12px;
    background: var(--accent-soft);
    border: 1px solid #c7d7fe;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .selected-customer-card .primary { font-weight: 600; font-size: 15px; }
  .selected-customer-card .secondary { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .link-btn {
    background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; padding: 8px 4px; cursor: pointer;
    flex-shrink: 0;
  }
  .link-btn:active { opacity: .7; }

  .selected-summary {
    padding: 0 2px 4px;
    margin-bottom: 4px;
    font-size: 14px;
    color: var(--muted);
  }
  .selected-summary b { color: var(--text); }

  .line-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .line-card .line-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .line-card .line-title { font-weight: 600; font-size: 15px; }
  .line-card .line-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .remove-btn {
    background: transparent; border: none; color: var(--danger);
    font-size: 13px; font-weight: 600; padding: 4px 8px; cursor: pointer;
  }
  .uom-row { margin-top: 12px; }
  .uom-row label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
  .uom-row select { padding: 12px 14px; }
  .qty-price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .qty-price-row label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
  .line-total { text-align: right; margin-top: 10px; font-size: 15px; color: var(--text); font-weight: 700; }
  .price-hint { font-size: 12px; color: var(--warn); margin-top: 6px; }

  .add-item-btn {
    width: 100%;
    background: transparent;
    border: 1.5px dashed #c9ced6;
    color: var(--accent);
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-item-btn:active { background: var(--accent-soft); }

  .review-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .review-row:last-child { border-bottom: none; }
  .review-row .label { color: var(--muted); }
  .review-total { display: flex; justify-content: space-between; padding: 18px 0 4px; font-size: 20px; font-weight: 700; }

  .status-card { text-align: center; padding: 56px 20px; }
  .status-icon { font-size: 40px; line-height: 1; margin-bottom: 18px; }
  .status-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .status-detail { color: var(--muted); font-size: 14.5px; line-height: 1.55; }
  .status-detail b { color: var(--text); }
  .result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
  .result-actions .btn { width: 100%; }
  .status-note { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 18px; }

  footer.actionbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(247, 248, 250, 0), var(--bg) 35%);
    padding: 20px 20px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; gap: 10px;
    max-width: 520px; margin: 0 auto;
  }
  button.btn {
    flex: 1;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(37, 99, 235, .3); }
  button.btn-primary:active { background: var(--accent-dark); }
  button.btn-primary:disabled { background: #e3e6eb; color: #9aa1ad; box-shadow: none; cursor: not-allowed; }
  button.btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); flex: 0 0 88px; box-shadow: var(--shadow); }

  .banner {
    border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px;
    border: 1px solid var(--border); background: var(--panel);
  }
  .banner.error { border-color: #fecdca; background: #fef3f2; color: #b42318; }
  .banner.warn { border-color: #fedf89; background: #fffaeb; color: #93370d; }
  .banner.success { border-color: #abefc6; background: #ecfdf3; color: #067647; }
  .banner.info { border-color: var(--border); background: var(--panel); color: var(--muted); }

  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, .4);
    border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="header-title">Quick Invoice</h1>
    <span class="step-pill" id="step-pill">Step 1 of 5</span>
  </header>

  <main>
    <div id="banner-slot"></div>

    <!-- Screen 1: Company -->
    <section class="screen active" data-screen="company">
      <div class="field-label">Select company</div>
      <div class="company-grid" id="company-grid"></div>
    </section>

    <!-- View: what do you want to do with this company? -->
    <section class="screen" data-screen="mode">
      <div class="selected-summary" id="mode-context"></div>
      <div class="company-grid">
        <div class="choice-card" id="mode-new">New invoice</div>
        <div class="choice-card" id="mode-view">Recent invoices</div>
      </div>
    </section>

    <!-- View: recently issued invoices -->
    <section class="screen" data-screen="invoiceList">
      <div class="selected-summary" id="invoice-list-context"></div>
      <div class="field-label" id="invoice-list-window"></div>
      <div class="list" id="invoice-list"></div>
    </section>

    <!-- View: one issued invoice -->
    <section class="screen" data-screen="invoiceDetail">
      <div id="invoice-detail-head"></div>
      <div class="field-label">Lines</div>
      <div id="invoice-detail-lines"></div>
      <div class="review-total">
        <span>Total</span>
        <span id="invoice-detail-total">RM 0.00</span>
      </div>
      <div id="invoice-detail-actions"></div>
    </section>

    <!-- View: edit an issued invoice's lines -->
    <section class="screen" data-screen="invoiceEdit">
      <div class="selected-summary" id="edit-context"></div>
      <div class="field-label">Lines</div>
      <div id="edit-line-list"></div>
      <button class="add-item-btn" id="edit-add-item-btn">+ Add item</button>
      <div id="edit-item-picker" style="display:none; margin-top:14px;">
        <input type="search" id="edit-item-search" placeholder="Search item code or name..." autocomplete="off" />
        <div class="list" id="edit-item-search-list"></div>
      </div>
    </section>

    <!-- View: confirm the change before saving -->
    <section class="screen" data-screen="invoiceEditConfirm">
      <div class="selected-summary" id="edit-confirm-context"></div>
      <div class="field-label">Changes</div>
      <div id="edit-diff"></div>
      <div class="review-total">
        <span>New total</span>
        <span id="edit-new-total">RM 0.00</span>
      </div>
    </section>

    <!-- Screen 2: Customer + address -->
    <section class="screen" data-screen="customer">
      <div id="customer-search-block">
        <div class="field-label">Search customer</div>
        <input type="search" id="customer-search" placeholder="Type customer name or code..." autocomplete="off" />
        <div class="list" id="customer-list"></div>
      </div>

      <div id="customer-selected-block" style="display:none;">
        <div class="field-label">Customer</div>
        <div class="selected-customer-card">
          <div>
            <div class="primary" id="selected-customer-name"></div>
            <div class="secondary" id="selected-customer-code"></div>
          </div>
          <button type="button" id="change-customer-btn" class="link-btn">Change</button>
        </div>
      </div>

      <div id="address-section" style="display:none;">
        <div class="field-label">Delivery address</div>
        <div class="list" id="address-list"></div>
      </div>
    </section>

    <!-- Screen 3: Items -->
    <section class="screen" data-screen="items">
      <div class="selected-summary" id="items-context"></div>
      <div class="field-label">Invoice date</div>
      <input type="date" id="invoice-date" />

      <div class="field-label">Items</div>
      <div id="line-list"></div>
      <button class="add-item-btn" id="add-item-btn">+ Add item</button>

      <!-- item picker (inline, appears below when adding) -->
      <div id="item-picker" style="display:none; margin-top:14px;">
        <input type="search" id="item-search" placeholder="Search item code or name..." autocomplete="off" />
        <div class="list" id="item-search-list"></div>
      </div>
    </section>

    <!-- Screen 4: Review -->
    <section class="screen" data-screen="review">
      <div class="selected-summary" id="review-context"></div>
      <div class="field-label">Line items</div>
      <div id="review-lines"></div>
      <div class="review-total">
        <span>Total</span>
        <span id="review-total-amount">RM 0.00</span>
      </div>
    </section>

    <!-- Screen 5: Result -->
    <section class="screen" data-screen="result">
      <div class="status-card" id="result-card"></div>
    </section>
  </main>

  <footer class="actionbar" id="actionbar">
    <button class="btn btn-secondary" id="back-btn">Back</button>
    <button class="btn btn-primary" id="next-btn">Next</button>
  </footer>
</div>

<!-- The query string is a cache key, not a parameter. Browsers that loaded
     this page before app.js carried Cache-Control still hold that copy under
     heuristic freshness and will not ask for it again for a while; a
     different URL cannot be answered from that entry, so they fetch it once
     and pick up the no-cache header that keeps them current from then on.
     Bump the date only if that situation ever recurs. -->
<script src="/app.js?v=2026-10-07-uom"></script>
</body>
</html>
