[project]
name = "autocount-mobile-quick-invoice"
version = "0.1.0"
description = "Mobile-first invoice-entry front end for AutoCount Cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
